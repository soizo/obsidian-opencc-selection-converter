---
name: Build plugin

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (for example, 0.2.0)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set build version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid version: ${version}`);
          }

          const readJson = async path =>
            JSON.parse(await readFile(path, 'utf8'));
          const writeJson = (path, value) =>
            writeFile(path, `${JSON.stringify(value, null, 2)}\n`);
          const manifest = await readJson('manifest.json');
          const packageJson = await readJson('package.json');
          const versions = await readJson('versions.json');

          manifest.version = version;
          packageJson.version = version;
          versions[version] = manifest.minAppVersion;

          await Promise.all([
            writeJson('manifest.json', manifest),
            writeJson('package.json', packageJson),
            writeJson('versions.json', versions),
          ]);
          NODE

      - name: Prepare pinned OpenCC source
        run: |
          mkdir -p "$HOME/Local/Cloned"
          git clone https://github.com/BYVoid/OpenCC.git \
            "$HOME/Local/Cloned/OpenCC"
          commit="$(node -p \
            "require('./engine/upstream.lock.json').opencc.commit")"
          git -C "$HOME/Local/Cloned/OpenCC" checkout "$commit"

      - name: Prepare pinned Emscripten SDK
        run: |
          mkdir -p "$HOME/Local/Cloned"
          git clone https://github.com/emscripten-core/emsdk.git \
            "$HOME/Local/Cloned/emsdk"
          commit="$(node -p \
            "require('./engine/upstream.lock.json').emsdk.commit")"
          version="$(node -p \
            "require('./engine/upstream.lock.json').emsdk.version")"
          git -C "$HOME/Local/Cloned/emsdk" checkout "$commit"
          "$HOME/Local/Cloned/emsdk/emsdk" install "$version"
          "$HOME/Local/Cloned/emsdk/emsdk" activate "$version"

      - name: Build and verify
        run: |
          npm run check
          npm run test:build
          npm run build:engine
          npm run build
          node scripts/verify-artifact.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidian-opencc-selection-converter-${{ inputs.version }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/versions.json
          if-no-files-found: error
