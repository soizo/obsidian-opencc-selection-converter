---
name: Build plugin

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (for example, 0.2.0)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify committed release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-release-metadata.mjs "$VERSION"

      - name: Prepare pinned OpenCC source
        run: |
          mkdir -p "$HOME/Local/Cloned"
          git clone https://github.com/BYVoid/OpenCC.git \
            "$HOME/Local/Cloned/OpenCC"
          commit="$(node -p \
            "require('./engine/upstream.lock.json').opencc.commit")"
          git -C "$HOME/Local/Cloned/OpenCC" checkout "$commit"

      - name: Prepare pinned Emscripten SDK
        run: |
          mkdir -p "$HOME/Local/Cloned"
          git clone https://github.com/emscripten-core/emsdk.git \
            "$HOME/Local/Cloned/emsdk"
          commit="$(node -p \
            "require('./engine/upstream.lock.json').emsdk.commit")"
          version="$(node -p \
            "require('./engine/upstream.lock.json').emsdk.version")"
          git -C "$HOME/Local/Cloned/emsdk" checkout "$commit"
          "$HOME/Local/Cloned/emsdk/emsdk" install "$version"
          "$HOME/Local/Cloned/emsdk/emsdk" activate "$version"

      - name: Build and verify
        run: |
          npm run check
          npm run test:build
          npm run build:engine
          npm run build
          node scripts/verify-artifact.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidian-opencc-selection-converter-${{ inputs.version }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/versions.json
            dist/styles.css
          if-no-files-found: error
